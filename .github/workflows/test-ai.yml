
name: Test MOR AI Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    
      - name: Check authentication configuration
        env:
          MOR_AI_APP_TOKEN: ${{ secrets.MOR_AI_APP_TOKEN }}
        run: |
          if [ -z "$MOR_AI_APP_TOKEN" ]; then
            echo "ERROR: GitHub secret is missing or empty"
            exit 1
          fi
          echo "GitHub secret is configured"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test MOR AI chat
        env:
          MOR_AI_APP_TOKEN: ${{ secrets.MOR_AI_APP_TOKEN }}
        run: node backend/test-chat.js
